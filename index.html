<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HSC Practical Viewer</title>
    <meta name="description" content="View any Scribd document instantly or save it as a high-quality PDF. Fast parallel downloads, compiled right in your browser." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HSC Viewer" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HSC Practical Viewer" />
    <meta property="og:title" content="HSC Practical Viewer" />
    <meta property="og:description" content="View any Scribd document instantly or save it as a high-quality PDF — fast, free, right in your browser." />
    <meta property="og:image" content="https://hsc-practical-viewer.onrender.com/og-image.png" />
    <meta property="og:url" content="https://hsc-practical-viewer.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HSC Practical Viewer" />
    <meta name="twitter:description" content="View any Scribd document instantly or save it as a high-quality PDF." />
    <meta name="twitter:image" content="https://hsc-practical-viewer.onrender.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme
      (function () {
        try {
          var stored = localStorage.getItem('hsc-theme');
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#000000' : '#f5f5f7');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('ServiceWorker registered successfully:', reg.scope);
          }).catch((err) => {
            console.log('ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
